<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aida & Khashayar | Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-layer"></div>
  <div class="overlay"></div>

  <main class="app">
    <section class="hero">
      <p class="eyebrow">YOU ARE INVITED TO THE ENGAGEMENT OF</p>
      <img class="title-save-date" src="assets/save_date.png" alt="Save the Date" />
      <img class="title-names" src="assets/names.png" alt="Aida & Khashayar" />
      <p class="instruction" id="instruction">Tap the envelope to open</p>
    </section>

    <section class="stage-wrap">
      <div class="stage" id="stage" aria-label="Interactive envelope" role="button" tabindex="0">
        <img class="closed-envelope" id="closedEnvelope" src="assets/closed_envelope.png" alt="Closed envelope" />
        <img class="open-envelope" id="openEnvelope" src="assets/open_envelope.png" alt="Open envelope" />
        <img class="card-preview" id="cardPreview" src="assets/full_card.png" alt="Invitation card preview" />
        <button class="card-open-btn" id="cardButton" type="button">View Invitation</button>
      </div>
    </section>

    <section class="bottom-hint">
      <button class="ghost-button" id="openInviteBottom" type="button">Open full invitation</button>
    </section>
  </main>

  <div class="modal hidden" id="inviteModal" aria-hidden="true">
    <div class="modal-backdrop" id="closeModalBackdrop"></div>
    <div class="modal-panel">
      <button class="icon-button close-button" id="closeModal" aria-label="Close invitation">×</button>

      <div class="modal-topbar">
        <button class="pill-button" id="mapButton" type="button">Open Map</button>
        <button class="pill-button hidden" id="musicToggle" type="button">Play Music</button>
      </div>

      <div class="invite-view">
        <img src="assets/full_card.png" alt="Full invitation" class="invite-full-image" />
      </div>
    </div>
  </div>

  <audio id="bgMusic" preload="none">
    <source src="assets/music.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
